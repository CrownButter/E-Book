services:
  postgres:
    image: postgres:17
    container_name: ebook-postgres
    environment:
      POSTGRES_DB: ebook
      POSTGRES_USER: ebook
      POSTGRES_PASSWORD: ebook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ebook-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ebook
      SPRING_DATASOURCE_USERNAME: ebook
      SPRING_DATASOURCE_PASSWORD: ebook
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
