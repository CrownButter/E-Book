spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ebook}
    username: ${SPRING_DATASOURCE_USERNAME:ebook}
    password: ${SPRING_DATASOURCE_PASSWORD:ebook}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080
